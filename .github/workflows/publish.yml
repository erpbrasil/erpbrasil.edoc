name: publish

# Publica no PyPI a versão de cada Release do GitHub. Não há token: o PyPI
# confia neste workflow rodando no ambiente pypi (Trusted Publishing).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'
    - name: build
      run: |
        python -m pip install --progress-bar=off build twine check-wheel-contents
        python -m build
        check-wheel-contents dist/*.whl --ignore W002
        python -m twine check --strict dist/*
    - name: versão do pacote igual à da tag
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
        if [ "${TAG#v}" != "$version" ] || [ ! -f "dist/erpbrasil_edoc-${TAG#v}.tar.gz" ]; then
          echo "A tag $TAG não corresponde à versão do pacote:"
          ls dist
          exit 1
        fi
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: dist
        path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/erpbrasil.edoc/
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
